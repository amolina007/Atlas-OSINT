[build]
  publish = "dist"
  functions = "netlify/functions"

[dev]
  targetPort = 3998
  framework = "#static"
  publish = "dist"
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://s3.tradingview.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://tile.openstreetmap.org https://*.tile.opentopomap.org https://utilbunuziotzumuiayu.supabase.co wss://utilbunuziotzumuiayu.supabase.co https://*.tradingview.com wss://*.tradingview.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.opentopomap.org https://*.tradingview.com; frame-src https://*.tradingview.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
